spring:
  config:
    name: agentX-app
  profiles:
    active: dev

# 认证过滤器配置；白名单内的接口不需要携带Token
auth:
  filter:
    enabled: true
    exclude-paths:
      - /auth/login

# 对话上下文窗口；输出部分会从模型窗口内预留
conversation:
  context:
    max-window-tokens: ${CONVERSATION_MAX_WINDOW_TOKENS:131072}
    output-reserve-tokens: ${CONVERSATION_OUTPUT_RESERVE_TOKENS:8192}
    summary:
      enabled: ${CONVERSATION_CONTEXT_SUMMARY_ENABLED:true}
      trigger-ratio: ${CONVERSATION_CONTEXT_SUMMARY_TRIGGER_RATIO:0.80}
      target-ratio: ${CONVERSATION_CONTEXT_SUMMARY_TARGET_RATIO:0.65}
      max-summary-tokens: ${CONVERSATION_CONTEXT_SUMMARY_MAX_TOKENS:8192}
      min-recent-groups: ${CONVERSATION_CONTEXT_SUMMARY_MIN_RECENT_GROUPS:4}
